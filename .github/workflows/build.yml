name: Build Application

on:
push:
branches:
- main
- master
pull_request:
branches:
- main
- master

jobs:
build-and-package:
name: Build & Package App
runs-on: ubuntu-latest

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Python 3.10
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'
      cache: 'pip'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install flake8 pyinstaller

  - name: Lint Code & Verify Compilation
    run: |
      # Stop build if there are Python syntax errors or undefined names
      flake8 snap.py --count --select=E9,F63,F7,F82 --show-source --statistics
      # Compile check
      python -m py_compile snap.py

  - name: Package Application Bundle
    run: |
      mkdir -p release_build
      cp snap.py requirements.txt Dockerfile release_build/
      cd release_build
      zip -r ../page-snap-share-app.zip .

  - name: Upload Build Artifact
    uses: actions/upload-artifact@v4
    with:
      name: page-snap-share-app
      path: page-snap-share-app.zip
      retention-days: 7

  - name: Build Docker Container
    run: |
      docker build -t page-snap-share:latest .
