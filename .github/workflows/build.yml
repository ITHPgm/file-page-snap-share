name: Build Application

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-package:
    name: Build & Package App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pyinstaller pytest

      - name: Lint Code & Verify Compilation
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 snap.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
          # Compile check
          python -m py_compile snap.py

      - name: Run Tests (only if tests exist)
        run: |
          # Check for common test filename patterns and only run pytest when tests found
          if ls tests/test_*.py 1> /dev/null 2>&1 || ls test_*.py 1> /dev/null 2>&1 || ls **/test_*.py 1> /dev/null 2>&1; then
            echo "Tests found — running pytest..."
            pytest -q
          else
            echo "No tests found — skipping pytest."
          fi

      - name: Package Application Bundle
        run: |
          mkdir -p release_build
          cp snap.py requirements.txt Dockerfile release_build/ || true
          cd release_build || exit 0
          zip -r ../page-snap-share-app.zip . || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: page-snap-share-app
          path: page-snap-share-app.zip
          retention-days: 7

      
      - name: Build Docker Container (tries release_build first, then repo root)
        run: |
          echo "Attempting to build Docker image..."
          # Prefer release_build/Dockerfile (if present), else fallback to repo root Dockerfile
          if [ -f release_build/Dockerfile ]; then
            echo "Found release_build/Dockerfile — building from release_build context"
            docker build -t page-snap-share:latest release_build
          elif [ -f Dockerfile ]; then
            echo "Found repo-root Dockerfile — building from repo root"
            docker build -t page-snap-share:latest .
          else
            echo "::error::No Dockerfile found in release_build/ or repo root. Aborting docker build."
            echo "Repository root listing:"
            ls -la
            exit 1
          fi
