name: Build and Test Streamlit App

on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]

jobs:
build-and-test:
runs-on: ubuntu-latest

steps:
- name: Checkout Code
  uses: actions/checkout@v4

- name: Set up Python 3.10
  uses: actions/setup-python@v5
  with:
    python-python-version: "3.10"
    cache: 'pip'

- name: Install Dependencies
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install flake8

- name: Lint Code & Check Syntax
  run: |
    # Stop the build if there are Python syntax errors or undefined names
    flake8 snap.py --count --select=E9,F63,F7,F82 --show-source --statistics
    # Check that the script compiles cleanly
    python -m py_compile snap.py

- name: Test Docker Build
  run: |
    docker build -t page-snap-share:latest .
